apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: offline-scheduler-role
  namespace: offline-job
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get","list","watch","create","delete"]
- apiGroups: ["core"]
  resources: ["pods"]
  verbs: ["get","list","watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get","list","watch","create","update","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: offline-scheduler-rb
  namespace: offline-job
subjects:
- kind: ServiceAccount
  name: offline-scheduler-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: offline-scheduler-role
---
# nodes 是集群级资源，namespaced Role 无法授权，必须使用 ClusterRole。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: offline-scheduler-node-reader
rules:
- apiGroups: ["core"]
  resources: ["nodes"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: offline-scheduler-node-reader
subjects:
- kind: ServiceAccount
  name: offline-scheduler-sa
  namespace: offline-job
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: offline-scheduler-node-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offline-scheduler-sa
  namespace: offline-job

